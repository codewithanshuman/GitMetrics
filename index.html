<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally – GitHub line counter and repo stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#E9EEEB;--panel:#F6F9F7;--ink:#10201A;--mute:#5B6B64;--rule:#C4D0CA;--acc:#2B45F0;--accink:#fff;--err:#B3261E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101A16;--panel:#16231D;--ink:#E7EFEA;--mute:#92A39A;--rule:#2A3B33;--acc:#7F92FF;--accink:#0B1230;--err:#FF8A80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:1040px;margin:0 auto;padding:56px 24px 96px}
h1{font-size:clamp(40px,7vw,76px);line-height:.95;font-weight:800;letter-spacing:-.035em;margin:0 0 14px}
.lede{color:var(--mute);max-width:46ch;margin:0 0 36px}
form{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{flex:1 1 320px;display:flex;align-items:center;background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:0 16px}
.field span{color:var(--mute)}
.field input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:20px;font-weight:600;padding:16px 4px;outline:0}
.field:focus-within{outline:3px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:0 28px;min-height:56px;background:var(--acc);color:var(--accink);cursor:pointer}
button:disabled{opacity:.55;cursor:progress}
button:focus-visible,summary:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ghost{background:none;color:var(--ink);border:1.5px solid var(--rule);min-height:40px;padding:0 16px;font-size:15px}
details{color:var(--mute);font-size:15px}
summary{cursor:pointer;width:max-content}
.opts{display:grid;gap:12px;padding:14px 0 0;max-width:520px}
.opts label{display:grid;gap:4px}
.opts input[type=password],.opts input[type=text]{font:inherit;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--ink)}
.opts .chk{display:flex;gap:10px;align-items:flex-start}
#status{min-height:1.5em;margin:18px 0 0;color:var(--mute)}
#status.err{color:var(--err);font-weight:600}
#out{margin-top:40px}
.repo h2{font-size:clamp(26px,4vw,40px);margin:0;letter-spacing:-.02em;line-height:1.1}
.repo h2 a{color:inherit;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--acc)}
.repo p{color:var(--mute);margin:8px 0 0;max-width:68ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags b{font-weight:600;font-size:14px;border:1.5px solid var(--rule);border-radius:99px;padding:1px 12px}
.big{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 20px;margin:44px 0 18px}
.big strong{font-size:clamp(64px,15vw,176px);line-height:.88;font-weight:800;letter-spacing:-.05em}
.big span{color:var(--mute);font-size:20px}
.strip{display:flex;height:30px;border-radius:6px;overflow:hidden;gap:2px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1)}
.strip i{display:block;min-width:3px}
@keyframes grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.strip{animation:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 0;padding:0;list-style:none;font-size:15px}
.legend li{display:flex;gap:8px;align-items:center}
.legend em{width:12px;height:12px;border-radius:3px;display:block}
.legend small{color:var(--mute);font-size:inherit}
h3{font-size:22px;letter-spacing:-.01em;margin:56px 0 12px}
dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 32px;margin:0}
dl div{border-top:1.5px solid var(--rule);padding:12px 0 14px}
dt{color:var(--mute);font-size:15px}
dd{margin:0;font-size:26px;font-weight:600;letter-spacing:-.015em}
dd small{display:block;font-size:14px;font-weight:400;color:var(--mute);letter-spacing:0}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:10px 14px 10px 0;text-align:right;border-top:1.5px solid var(--rule);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:400;font-size:14px}
td.bar{width:28%;min-width:120px;padding-right:0}
td.bar div{height:8px;border-radius:4px;background:var(--acc);min-width:2px}
td.path{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:normal;word-break:break-all}
.note{color:var(--mute);font-size:14px;margin:12px 0 0;max-width:70ch}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.filters input,.filters select{font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--ink)}
.filters input{flex:1 1 240px}
.chart{width:100%;height:auto;display:block;margin-top:6px}
td.who{display:flex;align-items:center;gap:10px}
td.who img{width:28px;height:28px;border-radius:50%;background:var(--rule)}
td.who a{color:inherit}
.map{width:100%;height:auto;display:block;border-radius:6px}
.map text{font:11px "Bricolage Grotesque",system-ui,sans-serif;fill:#fff;pointer-events:none}
.dep{margin:0 0 18px}.dep h4{margin:0 0 4px;font-size:16px;font-weight:600}.dep h4 small{color:var(--mute);font-weight:400;font-size:14px}
#drop{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border:2px dashed var(--rule);border-radius:10px;padding:12px 16px;color:var(--mute);font-size:15px}
#drop.on{border-color:var(--acc);color:var(--ink)}
.chart+.chart{margin-top:18px}
.cmp td,.cmp th{text-align:right;vertical-align:middle}.cmp td:first-child,.cmp th:first-child{text-align:left}
.cmp .strip{min-width:150px;height:16px;animation:none}.best{color:var(--acc)}
.local .gh{display:none}
.linkbtn{all:unset;cursor:pointer;color:var(--acc);font-weight:600;text-decoration:underline;text-underline-offset:4px}
#bar{height:4px;margin-top:12px;background:var(--rule);border-radius:2px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#bar.ind i{width:35%;animation:slide 1.1s ease-in-out infinite alternate}
@keyframes slide{from{margin-left:0}to{margin-left:65%}}
@media (prefers-reduced-motion:reduce){#bar.ind i{animation:none}}
#toc{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin-bottom:8px;background:var(--bg);border-bottom:1.5px solid var(--rule)}
#toc button{flex:none;font:inherit;font-size:14px;font-weight:400;border:1.5px solid var(--rule);background:none;color:var(--ink);border-radius:99px;padding:2px 12px;cursor:pointer;min-height:0}
#toc button:hover,.chip:hover{border-color:var(--acc)}
h3{scroll-margin-top:60px}
.chip{font:inherit;font-size:14px;font-weight:400;border:1.5px solid var(--rule);background:none;color:var(--ink);border-radius:99px;padding:3px 12px;cursor:pointer;min-height:0}
#examples{margin-top:14px}
.actions{display:flex;gap:10px;margin-top:40px;flex-wrap:wrap}
@media print{:root{--bg:#fff;--panel:#fff;--ink:#000;--mute:#444;--rule:#ccc;--acc:#2B45F0}
form,.actions,#status,.lede,.filters,#toc,#bar,#rate,#examples,#cancel{display:none!important}.scroll{overflow:visible}h3{break-after:avoid}table,svg,dl div{break-inside:avoid}.strip{animation:none}main{padding:0}}
</style>
</head>
<body>
<main>
  <h1>Tally</h1>
  <p class="lede">Count the real lines in any GitHub repository, split into code, comments and blanks, with the repo’s stats alongside.</p>

  <form id="f">
    <div class="row">
      <label class="field"><span>github.com/</span><input id="repo" placeholder="owner/repo, or a/b c/d to compare, or @user" list="recent" autocomplete="off" spellcheck="false" required aria-label="Repository, as owner/name or a GitHub URL"></label>
      <datalist id="recent"></datalist>
      <button id="go">Count lines</button>
      <button id="cancel" class="ghost" type="button" hidden>Cancel</button>
    </div>
    <details>
      <summary>Options</summary>
      <div class="opts">
        <label>GitHub token (optional, for private repos and higher rate limits)
          <input id="token" type="password" autocomplete="off" placeholder="ghp_…"></label>
        <label>Branch, tag or commit (leave blank for the default branch)
          <input id="ref" type="text" autocomplete="off" spellcheck="false" placeholder="main"></label>
        <label class="chk"><input id="rem" type="checkbox"> <span>Remember this token in this browser</span></label>
        <label class="chk"><input id="vendor" type="checkbox"> <span>Include vendored, generated and lock files (node_modules, dist, *.lock, *.min.js)</span></label>
      </div>
    </details>
    <div id="drop" role="group" aria-label="Count local code"><span>Drop a .zip or folder here to count private or local code. Nothing is uploaded.</span>
      <button type="button" class="ghost" id="pz">Choose .zip</button><button type="button" class="ghost" id="pf">Choose folder</button>
      <input type="file" id="fz" accept=".zip" hidden><input type="file" id="ff" webkitdirectory hidden></div>
  </form>
  <div class="tags" id="examples" aria-label="Examples"><button class="chip" data-go="pallets/flask">pallets/flask</button><button class="chip" data-go="expressjs/express">expressjs/express</button><button class="chip" data-go="pallets/flask expressjs/express">Compare both</button><button class="chip" data-go="@pallets">@pallets</button></div>
  <div id="bar" hidden><i></i></div>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="out" hidden></section>
  <p id="rate" class="note"></p>
</main>

<script>
const $ = s => document.querySelector(s);
const nf = new Intl.NumberFormat("en-US");
const cf = new Intl.NumberFormat("en", {notation:"compact", maximumFractionDigits:1});
const fmt = n => nf.format(n);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const date = d => new Date(d).toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"});

// language table: name, extensions, line comment, block start, block end
const L = {};
const add = (n, exts, lc, bs, be) => exts.split(" ").forEach(e => L[e] = [n, lc||"", bs||"", be||""]);
add("JavaScript","js mjs cjs jsx","//","/*","*/");
add("TypeScript","ts tsx mts cts","//","/*","*/");
add("Python","py pyi","#",'"""','"""'); add("Ruby","rb","#"); add("Shell","sh bash zsh","#");
add("Java","java","//","/*","*/"); add("Kotlin","kt kts","//","/*","*/");
add("C","c h","//","/*","*/"); add("C++","cpp cc cxx hpp hh","//","/*","*/");
add("C#","cs","//","/*","*/"); add("Go","go","//","/*","*/"); add("Rust","rs","//","/*","*/");
add("Swift","swift","//","/*","*/"); add("Scala","scala","//","/*","*/"); add("Dart","dart","//","/*","*/");
add("PHP","php","//","/*","*/"); add("CSS","css","","/*","*/"); add("SCSS","scss less","//","/*","*/");
add("HTML","html htm","","<!--","-->"); add("Vue","vue svelte","","<!--","-->"); add("XML","xml svg","","<!--","-->");
add("YAML","yml yaml","#"); add("TOML","toml","#"); add("SQL","sql","--"); add("Lua","lua","--");
add("Haskell","hs","--"); add("R","r","#"); add("Perl","pl pm","#");
add("Dockerfile","dockerfile","#"); add("Makefile","makefile mk","#");
add("Jupyter Notebook","ipynb","#"); add("Markdown","md mdx"); add("JSON","json jsonc"); add("Text","txt rst");
const BIN = new Set("png jpg jpeg gif webp ico bmp pdf zip gz tgz bz2 7z rar woff woff2 ttf otf eot mp3 mp4 mov avi webm wasm jar so dll dylib exe bin class pyc o a psd ai sketch".split(" "));
const VENDOR = /(^|\/)(node_modules|vendor|dist|build|out|\.git|__pycache__|\.next|third_party|Pods)\//;
const GENERATED = /(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|Cargo\.lock|poetry\.lock|composer\.lock|Gemfile\.lock|\.min\.(js|css))$/;
const PALETTE = ["#2B45F0","#F2A100","#0E9F7E","#D6336C","#7048E8","#1C7ED6","#E8590C","#5C7C6E"];
const REST = "#9BAAA3";

function tally(text, d) {
  const [, lc, bs, be] = d;
  const lines = text.split("\n");
  if (lines[lines.length-1] === "") lines.pop();
  let code = 0, com = 0, blank = 0, inB = false;
  for (const raw of lines) {
    const s = raw.trim();
    if (!s) { blank++; continue; }
    if (inB) { com++; if (s.includes(be)) inB = false; continue; }
    if (lc && s.startsWith(lc)) { com++; continue; }
    if (bs && s.startsWith(bs)) { com++; if (s.indexOf(be, bs.length) < 0) inB = true; continue; }
    code++;
  }
  return {code, com, blank};
}

function parseRepo(v) {
  const p = v.trim().replace(/^https?:\/\/(www\.)?github\.com\//, "").split(/[?#]/)[0].replace(/\.git$/, "").split("/");
  if (p.length < 2 || !p[0] || !p[1]) return null;
  let ref = ""; try { ref = p[2] === "tree" && p[3] ? decodeURIComponent(p.slice(3).join("/")) : ""; } catch {}
  return [p[0], p[1], ref];
}

let AB = null, RATE = null; const CACHE = new Map();
async function api(path, token) {
  const r = await fetch(path.startsWith("http") ? path : "https://api.github.com" + path,
    {signal: AB && AB.signal, headers: {Accept:"application/vnd.github+json", ...(token ? {Authorization:"Bearer " + token} : {})}});
  const rem = r.headers.get("x-ratelimit-remaining");
  if (rem != null && !path.startsWith("/search")) RATE = [rem, r.headers.get("x-ratelimit-limit")];
  return r;
}
function busy(b) {
  $("#go").disabled = b; $("#cancel").hidden = !b; $("#bar").hidden = !b;
  if (b) { AB = new AbortController(); $("#bar").className = "ind"; $("#bar i").style.width = ""; }
  else $("#rate").textContent = RATE ? `GitHub API requests left this hour: ${RATE[0]} of ${RATE[1]}` : "";
}
function persistToken() {
  try { const t = $("#token").value.trim(); if ($("#rem").checked && t) localStorage.setItem("tally.token", t); else localStorage.removeItem("tally.token"); } catch {}
}
const smooth = () => matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth";

async function countOf(path, token) {
  try {
    const r = await api(path + (path.includes("?") ? "&" : "?") + "per_page=1", token);
    if (!r.ok) return null;
    const m = (r.headers.get("link") || "").match(/[&?]page=(\d+)>; rel="last"/);
    if (m) return +m[1];
    return (await r.json()).length;
  } catch { return null; }
}

function status(msg, err) { const s = $("#status"); s.textContent = msg; s.className = err ? "err" : ""; }
const dur = d => d < 1 ? Math.max(1, Math.round(d * 24)) + " hours" : d < 60 ? d.toFixed(1) + " days" : Math.round(d / 30) + " months";
function gitignore(t) {
  const res = t.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#") && !l.startsWith("!")).map(l => {
    const dir = l.endsWith("/"); let p = l.replace(/\/$/, ""); const anch = p.includes("/"); p = p.replace(/^\//, "");
    const r = p.replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*\*/g, "\u0000").replace(/\*/g, "[^/]*").replace(/\?/g, "[^/]").replace(/\u0000/g, ".*");
    return new RegExp((anch ? "^" : "(^|/)") + r + (dir ? "/" : "(/|$)"));
  });
  return p => res.some(r => r.test(p));
}
async function health(base, token) {
  try {
    const [c, o] = await Promise.all([api(base + "/issues?state=closed&per_page=100&sort=updated", token), api(base + "/issues?state=open&per_page=100&sort=updated&direction=asc", token)]);
    if (!c.ok || !o.ok) return null;
    const cl = await c.json(), op = await o.json();
    const days = (a, b) => (new Date(b) - new Date(a)) / 864e5;
    const med = a => a.length ? a.sort((x, y) => x - y)[Math.floor(a.length / 2)] : null;
    return {issueClose: med(cl.filter(i => !i.pull_request).map(i => days(i.created_at, i.closed_at))),
      prMerge: med(cl.filter(i => i.pull_request && i.pull_request.merged_at).map(i => days(i.created_at, i.closed_at))),
      stale: op.filter(i => days(i.updated_at, Date.now()) > 90).length, sample: op.length};
  } catch { return null; }
}
async function activity(base, token, path = "commit_activity") {
  for (let i = 0; i < 3; i++) {
    try {
      const r = await api(base + "/stats/" + path, token);
      if (r.status === 200) { const j = await r.json(); return Array.isArray(j) && j.length ? j : null; }
      if (r.status !== 202) return null;
    } catch { return null; }
    await new Promise(r => setTimeout(r, 1500));
  }
  return null;
}
const isTest = p => /(^|\/)(tests?|__tests__|specs?)\//i.test(p) || /\.(test|spec)\.[a-z]+$/i.test(p) || /(_test\.(go|py)|(^|\/)test_[^\/]+\.py)$/.test(p);
const NONCODE = new Set(["Markdown","JSON","Text","YAML","TOML","XML","Other"]);
function parseDeps(name, t) {
  try {
    if (name === "package.json") { const j = JSON.parse(t); const v = {...(j.devDependencies || {}), ...(j.dependencies || {})}; return ["npm", Object.keys(v), v]; }
    if (name === "requirements.txt") return ["pip", t.split("\n").map(l => l.trim()).filter(l => l && !/^[#-]/.test(l)).map(l => l.split(/[=<>~!\[; ]/)[0])];
    if (name === "go.mod") return ["go", [...t.matchAll(/^\s*(?:require\s+)?([\w.\-]+\.[\w.\-]+\/[^\s]+)\s+v[\w.\-+]+/gm)].map(x => x[1])];
    if (name === "cargo.toml") { const sec = t.split(/^\[(?:dev-|build-)?dependencies\]/m).slice(1).map(x => x.split(/^\[/m)[0]).join("\n"); return ["cargo", [...sec.matchAll(/^([\w\-]+)\s*=/gm)].map(x => x[1])]; }
    if (name === "gemfile") return ["gem", [...t.matchAll(/^\s*gem\s+["']([^"']+)/gm)].map(x => x[1])];
  } catch {}
  return null;
}
const rkey = "tally.recent";
function recent(add) {
  try {
    let r = JSON.parse(localStorage.getItem(rkey) || "[]");
    if (add) { r = [add, ...r.filter(x => x !== add)].slice(0, 8); localStorage.setItem(rkey, JSON.stringify(r)); }
    $("#recent").innerHTML = r.map(x => `<option value="${esc(x)}">`).join("");
  } catch {}
}
function tm(items, x, y, w, h, out) {
  if (!items.length) return;
  if (items.length === 1) { out.push({...items[0], x, y, w, h}); return; }
  const tot = items.reduce((t, i) => t + i.v, 0); let acc = 0, k = 0;
  while (k < items.length - 1 && acc + items[k].v < tot / 2) { acc += items[k].v; k++; }
  if (k === 0) { acc = items[0].v; k = 1; }
  const a = items.slice(0, k), b = items.slice(k), f = acc / tot;
  if (w >= h) { tm(a, x, y, w * f, h, out); tm(b, x + w * f, y, w * (1 - f), h, out); }
  else { tm(a, x, y, w, h * f, out); tm(b, x, y + h * f, w, h * (1 - f), out); }
}
const tick = () => new Promise(r => setTimeout(r));

async function countEntries(entries, vendor, conc) {
    const langs = {}, files = [], deps = [], dupMap = new Map(); let dupTotal = 0, skipped = 0, binary = 0, failed = 0, done = 0, idx = 0;
    const dec = new TextDecoder("utf-8");
    let ign = null; const gi = entries.find(e => e[0] === ".gitignore");
    if (gi && !vendor) { try { ign = gitignore(dec.decode(await gi[1].async("uint8array"))); } catch {} }
    const handle = async ([path, ent]) => {
      if (!vendor && (VENDOR.test(path) || GENERATED.test(path) || (ign && ign(path)))) { skipped++; return; }
      const fname = path.split("/").pop().toLowerCase();
      const ext = fname.includes(".") ? fname.split(".").pop() : fname;
      if (BIN.has(ext) || ent.size > 5e6) { binary++; return; }
      let buf; try { buf = await ent.async("uint8array"); } catch { failed++; return; }
      if (buf.length > 5e6 || buf.subarray(0, 8000).includes(0)) { binary++; return; }
      const def = L[ext] || ["Other", "", "", ""];
      let txt = dec.decode(buf);
      if (ext === "ipynb") { try { txt = JSON.parse(txt).cells.filter(c => c.cell_type === "code").map(c => [].concat(c.source).join("")).join("\n"); } catch {} }
      if (!vendor && /@generated|DO NOT EDIT|auto-?generated|Code generated/i.test(txt.slice(0, 400))) { skipped++; return; }
      if (L[ext] || ["gemfile","requirements.txt","go.mod","cargo.toml","package.json"].includes(fname)) {
        const dp = parseDeps(fname, txt); if (dp && dp[1].length) deps.push({file:path, kind:dp[0], names:[...new Set(dp[1])], vers:dp[2]});
      }
      const t = tally(txt, def), isCode = !NONCODE.has(def[0]);
      const br = isCode ? (txt.match(/\b(if|for|while|case|catch|elif|except)\b|&&|\|\|/g) || []).length : 0;

  if (gr) { let c = 0; const cum = gr.map(w => c += w[1] + w[2]), fin = cum[cum.length - 1] > 0 ? cum[cum.length - 1] : 1;
    const pts = cum.map((v, i) => `${(i / (cum.length - 1) * 1000).toFixed(1)},${(150 - Math.max(v, 0) / fin * 140).toFixed(1)}`).join(" ");
    growth = `<svg class="chart" viewBox="0 0 1000 156" role="img" aria-label="Estimated lines over time"><polygon points="0,150 ${pts} 1000,150" fill="var(--acc)" opacity=".18"/><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="3"/></svg><p class="note">An estimate built from GitHub’s weekly additions and deletions, scaled to today’s ${fmt(total)} lines, from ${date(gr[0][0] * 1000)} to ${date(gr[gr.length - 1][0] * 1000)}.</p>`; }
  const kloc = T.code / 1000, eff = 2.4 * Math.pow(kloc, 1.05), sched = 2.5 * Math.pow(eff, 0.38), cost = eff / 12 * 56286 * 1.8;
  const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], pc = d.punch && d.punch.length ? d.punch : null;
  const pm = pc ? Math.max(...pc.map(x => x[2]), 1) : 1;
  const punch = pc ? `<svg class="chart" viewBox="0 0 600 150" role="img" aria-label="Commits by day of week and hour, in UTC">${DAYS.map((n, i) => `<text x="0" y="${i * 20 + 18}" font-size="11" fill="var(--mute)">${n}</text>`).join("")}${pc.map(([dy, hr, c]) => `<circle cx="${40 + hr * 23}" cy="${dy * 20 + 14}" r="${c ? (2 + Math.sqrt(c / pm) * 8).toFixed(1) : .8}" fill="var(--acc)" opacity="${c ? .85 : .3}"><title>${DAYS[dy]} ${hr}:00 UTC: ${c} commits</title></circle>`).join("")}</svg>` : "";
  const NAMES = {readme:"README", license:"license", contributing:"contributing guide", code_of_conduct:"code of conduct", issue_template:"issue template", pull_request_template:"pull request template"};
  const cm = d.comm && d.comm.files ? Object.entries(NAMES).filter(([k]) => !d.comm.files[k]).map(([, v]) => v) : [];
  const rd = (d.rel || []).map(r => new Date(r.published_at || r.created_at)).filter(q => !isNaN(q)).sort((a, b) => b - a);
  const gaps = rd.slice(1).map((q, i) => (rd[i] - q) / 864e5).sort((a, b) => a - b);
  const cad = gaps.length ? gaps[Math.floor(gaps.length / 2)] : null, sinceRel = rd.length ? (Date.now() - rd[0]) / 864e5 : null;
  const hot = files.filter(f => f.br && f.lines >= 40).sort((a, b) => b.br - a.br).slice(0, 8);
  DEPS = deps;
  let since = "";
  try {
    const k = "tally.hist:" + d.o + "/" + d.n, prev = JSON.parse(localStorage.getItem(k) || "null");
    if (!d.local) {
      if (prev) since = `Since your last visit on ${date(prev.at)}: ${dl2(total - prev.lines)} lines, ${dl2((m.stargazers_count || 0) - prev.stars)} stars${d.commits != null && prev.commits != null ? ", " + dl2(d.commits - prev.commits) + " commits" : ""}.`;
      localStorage.setItem(k, JSON.stringify({lines:total, stars:m.stargazers_count || 0, commits:d.commits, at:Date.now()}));
    }
  } catch {}
  const mx = act ? Math.max(...act.map(w => w.total), 1) : 1;
  const chart = act ? `<svg class="chart" viewBox="0 0 520 90" role="img" aria-label="Commits per week over the last year">${act.map((w, i) => { const h = Math.max(w.total / mx * 84, w.total ? 2 : 1); return `<rect x="${i * 10}" y="${88 - h}" width="8" height="${h}" rx="1.5" fill="var(--acc)" opacity="${w.total ? 1 : .25}"><title>Week of ${date(w.week * 1000)}: ${w.total} commits</title></rect>`; }).join("")}</svg>` : "";
  Object.assign(LAST, {effort:{personMonths:+eff.toFixed(1), months:+sched.toFixed(1), cost:Math.round(cost)}, communityHealth:d.comm ? d.comm.health_percentage : null, testShare:pl + tl ? tl / (pl + tl) : null, dependencies:deps, ref:d.ref, folders:folders.slice(0, 30), contributors:who.slice(0, 20).map(c => ({login:c.login, commits:c.contributions})), commitsLastYear:yr, busFactor:bus});

  $("#out").innerHTML = `
  <nav id="toc" aria-label="Sections"></nav>
  <div class="repo">
    <h2><a href="${esc(m.html_url)}" target="_blank" rel="noopener">${esc(m.full_name)}</a></h2>
    ${m.description ? `<p>${esc(m.description)}</p>` : ""}
    ${(m.topics || []).length ? `<div class="tags">${m.topics.slice(0, 10).map(t => `<b>${esc(t)}</b>`).join("")}</div>` : ""}
  </div>

  <div class="big"><strong>${fmt(total)}</strong><span>lines across ${fmt(T.files)} files</span></div>
  <div class="strip" role="img" aria-label="Share of lines by language">${rows.map(g => `<i title="${esc(g.name)}: ${fmt(g.total)} lines" style="flex:${g.total};background:${g.color}"></i>`).join("")}</div>
  <ul class="legend">${legend}</ul>
  ${since ? `<p class="note">${esc(since)}</p>` : ""}

  <h3>Line breakdown</h3>
  <dl>
    ${stat("Code", fmt(T.code), pct(T.code, total) + " of all lines")}
    ${stat("Comments", fmt(T.com), pct(T.com, total) + " of all lines")}
    ${stat("Blank", fmt(T.blank), pct(T.blank, total) + " of all lines")}
    ${stat("Comment density", pct(T.com, T.code), "comments per line of code")}
    ${stat("Average file", fmt(Math.round(total / Math.max(T.files, 1))), "lines per file")}
    ${stat("Languages", fmt(rows.length))}
    ${stat("Duplicated lines", d.dup != null ? (d.dup * 100).toFixed(1) + "%" : null, "repeated elsewhere, approximate")}
    ${stat("Estimated effort", T.code ? (eff < 10 ? eff.toFixed(1) : fmt(Math.round(eff))) + " person-months" : null, "about " + (eff / sched).toFixed(1) + " people for " + sched.toFixed(1) + " months")}
    ${stat("Estimated cost", T.code ? "$" + cf.format(cost) : null, "rough COCOMO estimate, not a quote")}
    ${stat("Test code", pl + tl ? pct(tl, pl + tl) : null, pl ? Math.round(tl / pl * 100) + " test lines per 100 production lines" : "")}
  </dl>

  <h3>By language</h3>
  <div class="scroll"><table>
    <thead><tr><th>Language</th><th>Files</th><th>Code</th><th>Comments</th><th>Blank</th><th>Total</th><th></th></tr></thead>
    <tbody>${rows.slice(0, 25).map(g => `<tr><td><span style="color:${g.color}">&#9632;</span> ${esc(g.name)}</td><td>${fmt(g.files)}</td><td>${fmt(g.code)}</td><td>${fmt(g.com)}</td><td>${fmt(g.blank)}</td><td>${fmt(g.total)}</td><td class="bar"><div style="width:${g.total / rows[0].total * 100}%;background:${g.color}"></div></td></tr>`).join("")}<tr><td><b>Total</b></td><td>${fmt(T.files)}</td><td>${fmt(T.code)}</td><td>${fmt(T.com)}</td><td>${fmt(T.blank)}</td><td>${fmt(total)}</td><td></td></tr></tbody>
  </table></div>

  <h3>By folder</h3>
  <div class="scroll"><table>
    <thead><tr><th>Top-level folder</th><th>Files</th><th>Lines</th><th>Share</th><th></th></tr></thead>
    <tbody>${folders.slice(0, 15).map(g => `<tr><td>${esc(g.name)}</td><td>${fmt(g.files)}</td><td>${fmt(g.lines)}</td><td>${pct(g.lines, total)}</td><td class="bar"><div style="width:${g.lines / folders[0].lines * 100}%"></div></td></tr>`).join("")}</tbody>
  </table></div>

  <h3>Code map</h3>
  ${mapSvg}
  <p class="note">Each rectangle is a file, sized by its lines and colored by language. Hover for the path.</p>

  <h3>Files</h3>
  <div class="filters">
    <input id="fq" type="search" placeholder="Filter by path, for example src/ or .test." aria-label="Filter files by path" autocomplete="off">
    <select id="fl" aria-label="Filter by language"><option value="">All languages</option>${rows.map(g => `<option>${esc(g.name)}</option>`).join("")}</select>
    <select id="fs" aria-label="Sort files"><option value="lines">Sort by lines</option><option value="br">Sort by branches</option><option value="path">Sort by path</option></select>
  </div>
  <div class="scroll"><table>
    <thead><tr><th>Path</th><th>Language</th><th>Lines</th></tr></thead>
    <tbody id="fb"></tbody>
  </table></div>
  <p id="fc" class="note"></p>
  <p class="note">Counted at <b>${esc(d.ref)}</b>. ${fmt(d.skipped)} vendored, generated or lock files ${d.vendor ? "were included" : "were left out"}, and ${fmt(d.binary)} binary or oversized files were skipped. Comment counts are based on each language’s comment syntax, so treat them as close estimates.${d.failed ? ` ${fmt(d.failed)} files couldn’t be fetched and aren’t counted.` : ""}${d.truncated ? " The repository is so large that GitHub returned a partial file list, so totals are incomplete." : ""}</p>

  ${hot.length ? `<h3>Complexity hotspots</h3><div class="scroll"><table><thead><tr><th>File</th><th>Branches</th><th>Per 100 lines</th><th>Lines</th></tr></thead><tbody>${hot.map(f => `<tr><td class="path">${esc(f.path)}</td><td>${fmt(f.br)}</td><td>${(f.br / f.lines * 100).toFixed(0)}</td><td>${fmt(f.lines)}</td></tr>`).join("")}</tbody></table></div><p class="note">Branches count if, for, while, case, catch and &amp;&amp; / || in each file. Files with many branches are usually the hardest to test and change.</p>` : ""}

  ${deps.length ? `<h3>Dependencies</h3>${deps.slice(0, 6).map((x, i) => `<div class="dep"><h4>${esc(x.file)} <small>${esc(x.kind)}, ${fmt(x.names.length)} packages</small></h4>${x.vers ? `<button class="ghost" type="button" data-dep="${i}">Check for updates</button><div id="dep${i}"></div>` : ""}<div class="tags">${x.names.slice(0, 14).map(t => `<b>${esc(t)}</b>`).join("")}${x.names.length > 14 ? `<b>+${x.names.length - 14} more</b>` : ""}</div></div>`).join("")}` : ""}

  ${act ? `<h3>Commit activity</h3>${heat}${chart}<p class="note">${fmt(yr)} commits in the last 52 weeks, with activity in ${weeks} of them (about ${(yr / 52).toFixed(1)} a week). Each bar is one week, oldest on the left.</p>` : ""}

  ${who.length ? `<h3>Top contributors</h3><div class="scroll"><table><tbody>${who.slice(0, 8).map(c => `<tr><td class="who"><img src="${esc(c.avatar_url)}&s=56" alt="" loading="lazy"><a href="${esc(c.html_url)}" target="_blank" rel="noopener">${esc(c.login)}</a></td><td>${fmt(c.contributions)} commits</td><td class="bar"><div style="width:${c.contributions / who[0].contributions * 100}%"></div></td></tr>`).join("")}</tbody></table></div><p class="note">Ranked by commits among the top ${who.length} contributors.</p>` : ""}

  ${pc ? `<h3>When commits happen</h3>${punch}<p class="note">Each dot is one hour of one weekday, in UTC. Bigger dots mean more commits, which hints at where and when the team works.</p>` : ""}

  ${gr ? `<h3>Growth over time</h3>${growth}` : ""}

  <div class="gh"><h3>Repository stats</h3>
  <dl>
    ${stat("Stars", fmt(m.stargazers_count), cf.format(m.stargazers_count) + " people starred it")}
    ${stat("Forks", fmt(m.forks_count))}
    ${stat("Watchers", fmt(m.subscribers_count ?? m.watchers_count))}
    ${stat("Open issues", fmt(issues))}
    ${stat("Open pull requests", d.prs != null ? fmt(d.prs) : null)}
    ${stat("Commits", d.commits != null ? fmt(d.commits) : null, "on " + esc(m.default_branch))}
    ${stat("Contributors", d.contribs != null ? fmt(d.contribs) : null)}
    ${stat("Releases", d.releases != null ? fmt(d.releases) : null)}
    ${stat("Commits in the last year", yr != null ? fmt(yr) : null, weeks != null ? "active in " + weeks + " of 52 weeks" : "")}
    ${stat("Release cadence", cad != null ? "every " + dur(cad) : null, sinceRel != null ? "last release " + dur(sinceRel) + " ago" : "")}
    ${stat("Community health", d.comm ? d.comm.health_percentage + "%" : null, d.comm ? (cm.length ? "missing: " + cm.join(", ") : "all key files present") : "")}
    ${stat("Median issue close time", hl && hl.issueClose != null ? dur(hl.issueClose) : null, "from the last 100 closed")}
    ${stat("Median PR merge time", hl && hl.prMerge != null ? dur(hl.prMerge) : null, "from the last 100 closed")}
    ${stat("Stale open items", hl ? fmt(hl.stale) : null, hl ? "idle 90+ days, of " + hl.sample + " checked" : "")}
    ${stat("Bus factor", bus != null ? fmt(bus) : null, bus != null ? (bus === 1 ? "contributor wrote" : "contributors wrote") + " half the commits" : "")}
    ${stat("License", esc(m.license ? m.license.spdx_id : "None"))}
    ${stat("Main language", esc(m.language || "–"))}
    ${stat("Created", date(m.created_at), age.toFixed(1) + " years ago")}
    ${stat("Last push", date(m.pushed_at))}
    ${stat("Size on GitHub", (m.size / 1024).toFixed(1) + " MB")}
    ${stat("Visibility", m.private ? "Private" : "Public", m.archived ? "Archived" : (m.fork ? "A fork" : "Active"))}
  </dl></div>

  <div class="actions">
    <button class="ghost" type="button" onclick="print()">Save as PDF</button>
    <button class="ghost" type="button" data-x="refresh">Refresh data</button>
    <button class="ghost" type="button" data-x="png">Download share image</button>
    <button class="ghost" type="button" data-x="cloc">Download cloc CSV</button>
    <button class="ghost" type="button" data-x="badge">Download badge</button>
    <button class="ghost" type="button" data-x="md">Copy Markdown</button>
    <button class="ghost" type="button" data-x="json">Download JSON</button>
    <button class="ghost" type="button" data-x="csv">Download CSV</button>
  </div>`;
  $("#out").className = d.local ? "local" : "";
  const hs = [...$("#out").querySelectorAll("h3")]; hs.forEach((h, i) => h.id = "sec" + i);
  $("#toc").innerHTML = hs.map(h => `<button type="button" data-jump="${h.id}">${esc(h.textContent)}</button>`).join("");
  ALL = files; drawFiles();
  $("#fq").addEventListener("input", drawFiles); $("#fl").addEventListener("change", drawFiles); $("#fs").addEventListener("change", drawFiles);
  $("#out").hidden = false;
  $("#out").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth"});
}

function save(name, type, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$("#out").addEventListener("click", e => {
  if (e.target.dataset && e.target.dataset.jump) { const t = document.getElementById(e.target.dataset.jump); if (t) t.scrollIntoView({behavior:smooth(), block:"start"}); return; }
  const g = e.target.dataset && e.target.dataset.go;
  if (g) { $("#repo").value = g; return $("#f").requestSubmit(); }
  if (e.target.dataset && e.target.dataset.dep != null) return checkDeps(+e.target.dataset.dep, e.target);
  const x = e.target.dataset && e.target.dataset.x; if (!x || !LAST) return;
  const slug = LAST.repo.replace("/", "-");
  if (x === "refresh") { CACHE.clear(); return $("#f").requestSubmit(); }
  if (x === "png") return shareImage();
  if (x === "cloc") return save(slug + "-cloc.csv", "text/csv", ["files,language,blank,comment,code", ...LAST.languages.map(g => `${g.files},"${g.name}",${g.blank},${g.com},${g.code}`), `${LAST.totals.files},SUM,${LAST.totals.blank},${LAST.totals.com},${LAST.totals.code}`].join("\n"));
  if (x === "badge") {
    const v = cf.format(LAST.totals.lines), rw = v.length * 8 + 20;
    return save(slug + "-lines.svg", "image/svg+xml", `<svg xmlns="http://www.w3.org/2000/svg" width="${96 + rw}" height="22" role="img" aria-label="lines of code: ${v}"><clipPath id="c"><rect width="${96 + rw}" height="22" rx="4"/></clipPath><g clip-path="url(#c)"><rect width="96" height="22" fill="#4b5b54"/><rect x="96" width="${rw}" height="22" fill="#2B45F0"/></g><g fill="#fff" font-family="Verdana,sans-serif" font-size="11" text-anchor="middle"><text x="48" y="15">lines of code</text><text x="${96 + rw / 2}" y="15">${v}</text></g></svg>`);
  }
  if (x === "md") {
    const t = LAST.totals, md = `**${LAST.repo}**: ${fmt(t.lines)} lines in ${fmt(t.files)} files (${fmt(t.code)} code, ${fmt(t.com)} comments, ${fmt(t.blank)} blank)\n\n| Language | Files | Code | Comments | Blank | Total |\n|---|---:|---:|---:|---:|---:|\n` + LAST.languages.slice(0, 10).map(g => `| ${g.name} | ${fmt(g.files)} | ${fmt(g.code)} | ${fmt(g.com)} | ${fmt(g.blank)} | ${fmt(g.total)} |`).join("\n");
    const btn = e.target;
    return navigator.clipboard.writeText(md).then(() => { btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy Markdown", 1600); }, () => { btn.textContent = "Copy failed"; });
  }
  if (x === "json") return save(slug + "-tally.json", "application/json", JSON.stringify(LAST, null, 2));
  const rows = [["language","files","code","comments","blank","total"], ...LAST.languages.map(g => [g.name, g.files, g.code, g.com, g.blank, g.total])];
  save(slug + "-tally.csv", "text/csv", rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n"));
});
$("#f").addEventListener("submit", run);
recent();
try { const tk = localStorage.getItem("tally.token"); if (tk) { $("#token").value = tk; $("#rem").checked = true; } } catch {}
$("#cancel").addEventListener("click", () => AB && AB.abort());
$("#examples").addEventListener("click", e => { const g = e.target.dataset && e.target.dataset.go; if (g) { $("#repo").value = g; $("#f").requestSubmit(); } });
{
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.includes("/")) { const [r, b] = h.split("@"); $("#repo").value = r; if (b) $("#ref").value = b; $("#f").requestSubmit(); }
}
</script>
</body>
